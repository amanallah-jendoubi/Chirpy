services:
  go-api:
    container_name: go-api-container
    build:
      context: .
      target: development
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: postgres:18.6-alpine
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"  
    environment:  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  pgdata: