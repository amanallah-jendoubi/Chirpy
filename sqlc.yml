version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query/"
    schema: "db/schema"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        overrides:               
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"